[package]
name = "caskade"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Log-structured key/value store inspired by bitcask"
repository = "https://github.com/dnlzrgz/caskade"
homepage = "https://github.com/dnlzrgz/caskade"
license = "MIT"
readme = "README.md"
keywords = ["key-value", "bitcask", "log-structured", "database"]
categories = ["database-implementations"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
rustc-hash = "2.1"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.7.0"
predicates = "3.1.4"
proptest = "1.11"
tempfile = "3.27.0"
walkdir = "2.5.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
strip = "none"
debug = "line-tables-only"

[[bench]]
name = "kv"
harness = false
