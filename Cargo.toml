[package]
name = "caskade"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
description = "Log-structured key/value store inspired by bitcask"
readme = "README.md"
homepage = "https://github.com/dnlzrgz/caskade"
repository = "https://github.com/dnlzrgz/caskade"
license = "MIT"
keywords = ["bitcask", "database", "key-value", "log-structured"]
categories = ["database-implementations"]

[[bench]]
harness = false
name = "kv"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
rustc-hash = "2.1"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.7.0"
predicates = "3.1.4"
proptest = "1.11"
tempfile = "3.27.0"
walkdir = "2.5.0"

[profile.bench]
debug = "line-tables-only"
strip = "none"

[profile.release]
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
